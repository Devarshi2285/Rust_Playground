[package]
name = "mediasoup-server"
version = "0.1.0"
edition = "2021"

[dependencies]
mediasoup = "0.20.0"
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = "0.28.0"
tungstenite = "0.28.0"
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
once_cell = "1"